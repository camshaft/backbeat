# TEMPORARY probe workflow — verifies the native-cargo + musl-tools build
# approach for the *-linux-musl CLI targets (which have C-dependency build
# scripts: zstd-sys, lz4), on both arch runners, since cross v0.2.5 cannot run
# on the aarch64 host. Deleted once folded into release.yml.
name: probe-aarch64-musl

on:
  push:
    branches: [ci/fix-aarch64-musl-binary]
  workflow_dispatch:

jobs:
  probe:
    name: probe ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: |
          cargo build --release --bin backbeat --locked \
            --package backbeat-cli --target ${{ matrix.target }}
          file target/${{ matrix.target }}/release/backbeat
