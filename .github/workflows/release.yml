on:
  push:
    tags:
      - "v*"
  # Allow producing binaries on demand (e.g. to test the pipeline) without cutting a tag. A manual
  # run builds + attaches nothing to a release and does NOT touch crates.io — it exercises the gate
  # and the per-target binary build so the pipeline can be smoke tested before a real tag.
  workflow_dispatch:

name: release

# Publish the workspace crates to crates.io and attach per-target CLI binaries to the GitHub Release
# when a version tag is pushed.
#
# AUTH — crates.io TRUSTED PUBLISHING via GitHub OIDC (no long-lived CARGO_REGISTRY_TOKEN secret).
# The publish job requests an OIDC id-token and `rust-lang/crates-io-auth-action` exchanges it for a
# short-lived, scoped crates.io token — nothing to store or rotate. ONE-TIME operator setup, once per
# crate, before the first OIDC publish can succeed: on crates.io, each crate → Settings → Trusted
# Publishing → add repository `camshaft/backbeat`, workflow `release.yml`. Until a crate's publisher
# is registered its publish step fails auth; the job is idempotent, so a re-run after registration
# completes cleanly.
#
# GATE — CI (ci.yml) runs on pushes/PRs to `main` but NOT on tags, so a tag push is otherwise
# ungated. This workflow therefore runs its OWN green gate (fmt + clippy + no-std + test, mirroring
# ci.yml) and both `build` and `publish` depend on it, so a tag can never ship a red tree.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1
  # The binary cargo builds and the name we publish it under.
  BIN_NAME: backbeat
  # rustfmt is pinned to nightly because .rustfmt.toml uses unstable options
  # (format_macro_matchers, imports_granularity); keep in sync with ci.yml.
  RUST_NIGHTLY_TOOLCHAIN: nightly-2026-01-14

jobs:
  # Green gate before any binary build or publish. Mirrors the publish-blocking checks in ci.yml
  # (fmt / clippy / no-std / test) in one job so a tag build is self-gating even though the scheduled
  # CI does not run on tags. (udeps is an unused-dependency hygiene check, not a publish blocker, so
  # it is intentionally left to ci.yml and omitted here.)
  gate:
    name: gate (fmt + clippy + no-std + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Two toolchains: nightly for the unstable-options rustfmt, stable for clippy/build/test.
      - name: Install rust toolchains
        run: |
          rustup toolchain install ${{ env.RUST_NIGHTLY_TOOLCHAIN }} --profile minimal --component rustfmt
          rustup toolchain install stable --profile minimal --component clippy
          rustup override set stable

      - uses: camshaft/rust-cache@v1

      - name: fmt
        run: cargo +${{ env.RUST_NIGHTLY_TOOLCHAIN }} fmt --all -- --check

      - name: clippy
        run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings

      # The format/descriptor half must keep building without `std` (drops `std` + `capture`).
      - name: no-std build
        run: cargo +stable build -p backbeat --no-default-features

      - name: test (all features)
        run: cargo +stable test --workspace --all-features

  build:
    name: build ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.os }}
    # Create the GitHub Release and upload the per-target binaries to it (on a tag push).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fully static Linux binaries via musl — download and run on any Linux host, no libc
          # version to match. This is the "grab the binary and convert a dump on the box" case. Each
          # builds natively on a runner of its own arch (GitHub now offers ARM Linux runners), so no
          # cross-compilation is needed.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # Apple silicon. macOS cannot produce a fully static binary (the system libs are always
          # dynamic), but this is otherwise self-contained.
          - target: aarch64-apple-darwin
            os: macOS-latest

    steps:
      - uses: actions/checkout@v7

      # musl-tools provides the `musl-gcc` linker the *-linux-musl targets need.
      - name: Install musl tools
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustup target add ${{ matrix.target }}

      - uses: camshaft/rust-cache@v1
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p backbeat-cli

      # Package the single binary as a tar.gz named for the target, so a release has one obvious
      # artifact per platform. The musl binaries are static; verify and strip to keep them small.
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${BIN_NAME}"
          test -f "$BIN"
          # Strip to shrink the artifact (best-effort; cross images ship the right strip).
          strip "$BIN" || true
          STAGE="${BIN_NAME}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/"
          cp README.md LICENSE "$STAGE/" || true
          ARCHIVE="${STAGE}.tar.gz"
          tar -czf "$ARCHIVE" "$STAGE"
          # Checksum so a downloader can verify the artifact.
          if command -v sha256sum >/dev/null; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

      # On a tag push, attach the per-target archive (and its checksum) to the GitHub Release. The
      # release is created on the first upload and appended to by the rest of the matrix.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

  # Publish the workspace crates to crates.io via Trusted Publishing (OIDC). Gated on both `gate`
  # (never publish a red tree) and `build` (never publish a tag whose binaries don't compile), and
  # only on a real tag push (a manual `workflow_dispatch` run stops after gate + build without
  # touching the registry).
  publish:
    name: publish to crates.io
    needs: [gate, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for crates.io Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable

      - uses: camshaft/rust-cache@v1

      # Exchange the GitHub OIDC id-token for a short-lived crates.io token (Trusted Publishing).
      # Exposes it as an output consumed by the publish step below. No stored secret.
      - name: crates.io auth (Trusted Publishing / OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Publish every workspace crate in DEPENDENCY ORDER, computed dynamically from `cargo metadata`
      # (topologically sorted by intra-workspace normal/build deps) so a newly added crate is picked
      # up automatically in the right place — no hand-maintained list to fall out of date. For the
      # current members this yields: backbeat-macros → backbeat → backbeat-cli. `cargo publish` blocks
      # until each version is live on the index before returning, so the next crate resolves it.
      # Idempotent: a crate whose current version is already on the crates.io sparse index is skipped,
      # so the job re-runs safely (a partial earlier run, or a crate registered/published later).
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          # Workspace members only (`--no-deps`): emit "<dep> <crate>" edges for intra-workspace,
          # non-dev dependencies, then `tsort` yields a dependency-first total order. Members with no
          # in-workspace edges are appended after.
          cargo metadata --no-deps --format-version 1 > /tmp/meta.json
          mapfile -t MEMBERS < <(jq -r '.packages[].name' /tmp/meta.json | sort)
          jq -r '
            (.packages | map(.name)) as $members
            | .packages[]
            | .name as $crate
            | .dependencies[]
            | select(.kind != "dev")
            | select(.name as $d | $members | index($d))
            | "\(.name) \($crate)"
          ' /tmp/meta.json | sort -u > /tmp/edges.txt

          ORDER="$(tsort /tmp/edges.txt)"
          for m in "${MEMBERS[@]}"; do
            grep -qxF "$m" <<<"$ORDER" || ORDER="$ORDER"$'\n'"$m"
          done
          echo "Publish order:"; echo "$ORDER" | sed '/^$/d' | nl

          published_version() {
            local crate="$1"
            jq -r --arg c "$crate" '.packages[] | select(.name==$c) | .version' /tmp/meta.json
          }
          is_publishable() {
            # `.publish == null` → any registry; `.publish == []` → disabled; a list → allowed set.
            local crate="$1"
            jq -e --arg c "$crate" '
              .packages[] | select(.name==$c)
              | (.publish == null) or (.publish | index("crates-io") != null)
            ' /tmp/meta.json >/dev/null 2>&1
          }
          already_on_cratesio() {
            local crate="$1" version="$2"
            # crates.io sparse index path for a 5+ char name: {c0c1}/{c2c3}/{name}. All backbeat
            # crate names are longer than four chars. The file lists one JSON object per version.
            local url="https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}"
            curl -fsSL -A "backbeat-release-ci" "$url" 2>/dev/null \
              | jq -re --arg v "$version" 'select(.vers == $v) | .vers' >/dev/null 2>&1
          }

          while IFS= read -r crate; do
            [ -n "$crate" ] || continue
            if ! is_publishable "$crate"; then
              echo "$crate: publish disabled in Cargo.toml; skipping."
              continue
            fi
            version="$(published_version "$crate")"
            if already_on_cratesio "$crate" "$version"; then
              echo "$crate $version already on crates.io; skipping."
            else
              echo "Publishing $crate $version ..."
              # backbeat commits Cargo.lock, so honor it on the publish verify build.
              cargo publish --locked -p "$crate"
            fi
          done <<<"$ORDER"
