name: release

# Fully-automatic, TOKENLESS release pipeline. This is the CANONICAL pattern shared across the
# camshaft release repos (backbeat / bach / bolero / etude); mirror it (libraries drop the `binaries`
# job). It is a SINGLE workflow — the crates.io OIDC publish runs in THIS file (not a reusable
# workflow_call), so the OIDC token's workflow claim is unambiguously `release.yml`, which is the
# filename the crates.io Trusted Publishers are registered under.
#
# On every push to `main`, release-plz (https://release-plz.dev):
#   - `release-pr`: keeps a version-bump + CHANGELOG "release PR" open, derived from the
#     conventional-commit history. Versions are INDEPENDENT per crate (release-plz default): a change
#     to one crate releases only it (plus any semver-required dependents), not the whole workspace.
#   - `release`: once a release PR is merged, publishes each newly-versioned crate to crates.io in
#     dependency order NATIVELY (`release-plz release` — no hand-rolled publish script), creates the
#     per-package git tags, and creates the GitHub Releases.
#
# AUTH: crates.io Trusted Publishing via GitHub OIDC (rust-lang/crates-io-auth-action) — NO
# CARGO_REGISTRY_TOKEN, NO PAT. Because the publish runs in the same workflow run as release-plz
# (not triggered by the tag), GitHub's anti-recursion rule never applies, so no elevated token is
# needed.
#
# ADOPTING THIS IN ANOTHER REPO (it is designed to be copied):
#   1. Repo setting: Settings → Actions → General → Workflow permissions → enable "Allow GitHub
#      Actions to create and approve pull requests". Without it the release-pr job 403s (the default
#      GITHUB_TOKEN cannot open the release PR), even though the job grants pull-requests: write.
#   2. crates.io Trusted Publisher, once per crate: crates.io → each crate → Settings → Trusted
#      Publishing → repo `camshaft/<repo>`, workflow `release.yml`, environment blank. Do this AFTER
#      this file exists on the repo's default branch. No token to paste.
#   3. Pure-library repos: delete the `binaries` job (it only builds a CLI).
#   4. If the repo's CI is CRON-ONLY (does not run on pushes/PRs to main), add a `gate` job here
#      (fmt/clippy/test, mirroring that repo's CI) that the `release` job `needs:`, so a merge to main
#      can't publish a red tree. backbeat omits it because its ci.yml already gates every push to main.

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

jobs:
  # Keep the version-bump + CHANGELOG "release PR" open/updated.
  release-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
      - name: release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After a release PR merges, publish the newly-versioned crates (native, dependency-ordered) via
  # OIDC, create the per-package tags, and create the GitHub Releases. Exposes the CLI's tag so the
  # binaries job can attach to its release in the same run.
  release:
    name: release-plz release (publish + tag)
    runs-on: ubuntu-latest
    permissions:
      contents: write # create git tags + GitHub Releases
      id-token: write # crates.io Trusted Publishing (OIDC)
    outputs:
      cli_tag: ${{ steps.cli.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
      # Exchange the GitHub OIDC id-token for a short-lived crates.io token (Trusted Publishing).
      - name: crates.io auth (OIDC Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: release-plz release
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # If this run released backbeat-cli, expose its tag so the binaries job attaches the CLI
      # binaries to that release. Empty (binaries job skipped) when the CLI wasn't part of the release.
      - name: CLI release tag
        id: cli
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag="$(printf '%s' "$RELEASES" | jq -r '.[] | select(.package_name == "backbeat-cli") | .tag')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Build the `backbeat` CLI for each shipped platform and attach the archives to the backbeat-cli
  # GitHub Release release-plz just created. Uses taiki-e/upload-rust-binary-action (an established
  # tool) — no bespoke build/upload script — and runs in the same run (no PAT). Only runs when the
  # CLI was part of this release. The `$bin-$target` archive name matches install.sh.
  binaries:
    name: binaries ${{ matrix.target }}
    needs: release
    if: ${{ needs.release.outputs.cli_tag != '' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload assets to the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fully static Linux binaries via musl — run on any Linux host, no libc to match. Each
          # builds natively on a runner of its own arch (no cross-compilation).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # Apple silicon. Self-contained (macOS system libs are always dynamic).
          - target: aarch64-apple-darwin
            os: macOS-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.cli_tag }}
      # musl-tools provides the `musl-gcc` linker the *-linux-musl targets need.
      - name: Install musl tools
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build + upload CLI binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: backbeat
          package: backbeat-cli
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          locked: true
          ref: refs/tags/${{ needs.release.outputs.cli_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
